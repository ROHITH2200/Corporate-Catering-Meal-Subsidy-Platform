<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catering Events | MealMate</title>
  <link rel="icon" href="../images/logo-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

<body>
  <a class="visually-hidden-focusable skip-link" href="#main">Skip to main content</a>
  <div id="navbar"></div>

  <main id="main" class="container">
    <div class="card events-banner my-4">
      <div class="row g-0 align-items-center">
        <div class="col-md-7 p-4 p-lg-5">
          <h1 class="h2 fw-bold mb-2">Catering events</h1>
          <p class="text-body-secondary mb-0">Pick your meal for company lunches and dinners before the deadline. You can change your choice until registration closes.</p>
        </div>
        <div class="col-md-5 d-none d-md-block">
          <img src="../images/veg-thali.jpg" width="960" height="592" class="banner-img" alt="A South Indian thali with dosa, idli, vada and curries">
        </div>
      </div>
    </div>

    <div id="eventList"></div>
  </main>

  <footer class="app-footer">
    <div class="container">MealMate demo with sample data. No real payments.</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/sample-data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/helpers.js"></script>
  <script src="../js/logic.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/pages/employee-events.js"></script>

</html>
