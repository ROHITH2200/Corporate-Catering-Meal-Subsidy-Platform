<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Expenses | MealMate</title>
  <link rel="icon" href="../images/logo-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
  <a class="visually-hidden-focusable skip-link" href="#main">Skip to main content</a>
  <div id="navbar"></div>

  <main id="main" class="container">
    <div class="page-header d-flex flex-wrap justify-content-between align-items-end gap-3">
      <div>
        <h1>My expenses</h1>
        <p>Every meal expense you submitted and its current status.</p>
      </div>
      <a class="btn btn-accent btn-mobile-full" href="submit-expense.html"><i class="bi bi-plus-lg" aria-hidden="true"></i> Submit meal expense</a>
    </div>

    <div class="row g-3 mb-4" id="summaryCards"></div>

    <div class="card section-card">
      <div class="card-body">
        <h2 class="section-title">Expense history</h2>
        <div id="statusFilter" class="filter-pills mb-3" role="group" aria-label="Filter by status"></div>
        <div id="expenseList"></div>
      </div>
    </div>
  </main>

  <footer class="app-footer">
    <div class="container">MealMate demo with sample data. No real payments.</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/sample-data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/helpers.js"></script>
  <script src="../js/logic.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/pages/my-expenses.js"></script>
</body>
</html>
