<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Management | MealMate</title>
  <link rel="icon" href="../images/logo-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
  <a class="visually-hidden-focusable skip-link" href="#main">Skip to main content</a>
  <div id="navbar"></div>

  <main id="main" class="container">
    <div class="page-header d-flex flex-wrap justify-content-between align-items-end gap-3">
      <div>
        <h1>Expense management</h1>
        <p>Review meal expenses and approve or reject them.</p>
      </div>
      <button class="btn btn-outline-primary btn-mobile-full" id="exportBtn" type="button"><i class="bi bi-download" aria-hidden="true"></i> Export CSV</button>
    </div>

    <div class="row g-3 mb-4" id="totals"></div>

    <div class="card section-card">
      <div class="card-body">
        <div class="row g-2 mb-3">
          <div class="col-md-6 col-lg-4">
            <label for="searchInput" class="form-label small">Search by employee name</label>
            <input type="search" id="searchInput" class="form-control" placeholder="e.g. Priya">
          </div>
          <div class="col-md-6 col-lg-8">
            <span class="form-label small d-block" id="statusLabel">Status</span>
            <div id="statusFilter" class="filter-pills" role="group" aria-labelledby="statusLabel"></div>
          </div>
        </div>
        <p class="small text-body-secondary" id="resultCount" aria-live="polite"></p>
        <div id="expenseList"></div>
      </div>
    </div>
  </main>

  <!-- Expense details side panel -->
  <div class="offcanvas offcanvas-end" tabindex="-1" id="expensePanel" aria-labelledby="expensePanelTitle">
    <div class="offcanvas-header border-bottom">
      <h2 class="offcanvas-title h5" id="expensePanelTitle">Expense details</h2>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body" id="expensePanelBody"></div>
  </div>

  <footer class="app-footer">
    <div class="container">MealMate demo with sample data. No real payments.</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/sample-data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/helpers.js"></script>
  <script src="../js/logic.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/pages/hr-expenses.js"></script>
</body>
</html>
