<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catering Management | MealMate</title>
  <link rel="icon" href="../images/logo-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
  <a class="visually-hidden-focusable skip-link" href="#main">Skip to main content</a>
  <div id="navbar"></div>

  <main id="main" class="container">
    <div class="page-header d-flex flex-wrap justify-content-between align-items-end gap-3">
      <div>
        <h1>Catering management</h1>
        <p>Create events, track registrations and share orders with vendors.</p>
      </div>
      <a class="btn btn-accent btn-mobile-full" href="create-event.html"><i class="bi bi-plus-lg" aria-hidden="true"></i> Create event</a>
    </div>

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <h2 class="section-title mb-0">Catering events</h2>
      <div id="dateFilter" class="filter-pills" role="group" aria-label="Filter events by date"></div>
    </div>
    <div id="eventList" class="mb-5"></div>

    <div class="card section-card">
      <div class="card-body">
        <h2 class="section-title">Vendors</h2>
        <div class="mb-3 vendor-search">
          <label for="vendorSearch" class="form-label small">Search vendors</label>
          <input type="search" id="vendorSearch" class="form-control" placeholder="Name or contact person">
        </div>
        <div id="vendorList"></div>
      </div>
    </div>
  </main>

  <footer class="app-footer">
    <div class="container">MealMate demo with sample data. No real payments.</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/sample-data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/helpers.js"></script>
  <script src="../js/logic.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/pages/hr-catering.js"></script>
</body>
</html>
